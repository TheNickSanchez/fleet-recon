[project]
name = "fleet-recon-session-host"
version = "0.1.0"
description = "Fleet Recon MVP Claude Agent SDK session-host skeleton (dependencies and env only; no application logic)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pandas>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
