# Leftover FastAPI + CrewAI scaffold. Not the Fleet Recon MVP product.
# Product dependencies live in session-host/pyproject.toml (Claude Agent SDK).
[project]
name = "fleet-recon-backend"
version = "0.1.0"
description = "Leftover FastAPI and CrewAI backend (unused / to-be-replaced)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.15,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
