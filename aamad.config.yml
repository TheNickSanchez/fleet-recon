# Example AAMAD project configuration.
# Copy to aamad.config.yml and adjust for your project.
# See .cursor/templates/aamad-config-template.yml for the full schema comments.

version: 1

runtime:
  target: claude-agent-sdk

language:
  primary: python
  secondary: []

libraries:
  approved: []
  forbidden: []

ui:
  theme: system
  visual_style: "modern-minimal-saas: clean, generous whitespace, subtle borders/elevation over heavy chrome, restrained color with one cohesive accent (Linear/Notion-like); no fixed brand palette supplied -- frontend engineer's discretion within this direction"
  prefer_modals: false  # prefer inline/side panels over modal dialogs; spacious layout, not dense

coding_standards:
  style_guide: ""
  type_checking: true
  max_file_lines: 400

security:
  require_security_assessment: true
  forbid_committed_secrets: true
  dependency_audit: true

documentation:
  require_user_guide: true
  sync_docs_after_code_changes: true

testing:
  require_unit_tests: true
  require_integration_tests: true
  map_to_acceptance_criteria: true
