<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{{TITLE}}</title>
<!--
  ARIA HTML Artifact Base Template
  DocuSign theme: warm-neutral canvas + Cobalt accent.
  When generating an artifact, copy the full <style> block verbatim into the
  new file. Do NOT link this file — every artifact is self-contained.
  Replace {{TITLE}}, {{TICKET}}, {{DATE}}, {{SUBTITLE}} with real values.

  Naming conventions:
    Sprint brief        ~/work/reports/brief-YYYY-MM-DD.html
    Fleet compliance    ~/work/reports/<kind>-YYYY-MM-DD.html
    CVE triage          ~/work/reports/cve-CVE-ID-YYYY-MM-DD.html
    Per-ticket report   ~/work/logs/CPE-XXXX/report.html
    Canary dashboard    ~/work/logs/CPE-XXXX/canary-YYYY-MM-DD.html

  Required copy-back footer on every artifact:
    <div class="copy-back">
      <h3>Continue in ARIA</h3>
      <pre id="cbtext">{{COPY_BACK_PROMPT}}</pre>
      <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('cbtext').innerText).then(()=>{this.textContent='Copied ✓';setTimeout(()=>this.textContent='Copy prompt',2000)})">Copy prompt</button>
    </div>
-->
<style>
  /* ── Palette ──────────────────────────────────────────────────────────── */
  :root{
    --bg:#FAF8F5;          /* Background / Canvas          */
    --surface:#F0EDE8;     /* Surface / Panels             */
    --border:#D4CFC7;      /* Borders / Dividers           */
    --muted:#8A837A;       /* Muted / Secondary text       */
    --text:#2C2825;        /* Main text                    */
    --accent:#4C00FF;      /* DocuSign Cobalt — primary    */
    --accent-hover:#3800CC;
    --good:#4A6B3A;        /* Status: healthy              */
    --warn:#C28829;        /* Status: warning              */
    --bad:#A23E2A;         /* Status: error                */
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.6 var(--sans)}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  a:hover{border-bottom-color:var(--accent)}

  /* ── Header ───────────────────────────────────────────────────────────── */
  header{
    padding:24px 32px 10px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);
    position:sticky;top:0;z-index:5;
  }
  header h1{margin:0;font-size:22px;letter-spacing:-.015em;font-weight:600}
  header h1 .ticket{color:var(--accent);margin-right:8px}
  header .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  header .sub strong{color:var(--text);font-weight:600}

  /* ── Tab nav ──────────────────────────────────────────────────────────── */
  nav{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  nav button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-family:var(--sans);
    transition:all .15s ease;
  }
  nav button:hover{color:var(--text);border-color:var(--muted)}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ── Layout ───────────────────────────────────────────────────────────── */
  main{max-width:1140px;margin:0 auto;padding:24px 32px 80px}
  section{display:none;animation:fade .18s ease}
  section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* ── Type ─────────────────────────────────────────────────────────────── */
  h2{font-size:19px;margin:4px 0 16px;letter-spacing:-.01em;font-weight:600}
  h3{font-size:11.5px;color:var(--accent);margin:24px 0 10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
  .small{font-size:12.5px;color:var(--muted)}
  ul{padding-left:20px} li{margin:5px 0}

  /* ── Grid ─────────────────────────────────────────────────────────────── */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}

  /* ── Cards ────────────────────────────────────────────────────────────── */
  .card{
    background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;
    box-shadow:0 1px 2px rgba(44,40,37,.03);
  }
  .card h4{margin:0 0 6px;font-size:14px;font-weight:600}
  .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}

  /* ── Pills ────────────────────────────────────────────────────────────── */
  .pill{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);margin-right:5px;
    background:var(--surface);font-weight:500;
  }
  .pill.good{color:#fff;background:var(--good);border-color:var(--good)}
  .pill.warn{color:#fff;background:var(--warn);border-color:var(--warn)}
  .pill.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
  .pill.accent{color:#fff;background:var(--accent);border-color:var(--accent)}
  .pill.muted{background:var(--surface);color:var(--muted)}

  /* ── Tables ───────────────────────────────────────────────────────────── */
  table{
    width:100%;border-collapse:separate;border-spacing:0;font-size:13px;
    background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  th{
    background:var(--surface);color:var(--text);font-weight:600;
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  }
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface)}

  /* ── Code ─────────────────────────────────────────────────────────────── */
  code{
    font-family:var(--mono);font-size:12px;
    background:var(--surface);padding:1px 5px;border-radius:4px;
    border:1px solid var(--border);
  }
  pre{
    font-family:var(--mono);font-size:12px;background:#fff;
    border:1px solid var(--border);border-radius:8px;padding:14px;
    overflow-x:auto;line-height:1.55;
  }
  pre code{background:none;border:none;padding:0}

  /* ── Buttons ──────────────────────────────────────────────────────────── */
  .btn{
    background:var(--accent);color:#fff;border:none;
    padding:8px 15px;border-radius:6px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:var(--sans);transition:background .15s;
    margin-right:6px;margin-bottom:4px;
  }
  .btn:hover{background:var(--accent-hover)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--surface)}
  .btn.small{padding:5px 11px;font-size:12px}

  /* ── Verdict / callout ────────────────────────────────────────────────── */
  .verdict{
    padding:14px 18px;border-radius:10px;
    background:linear-gradient(135deg,#EDE8FF 0%,var(--surface) 100%);
    border:1px solid var(--border);border-left:4px solid var(--accent);
    margin:8px 0 16px;
  }
  .verdict strong{color:var(--accent)}

  /* ── Phase blocks ─────────────────────────────────────────────────────── */
  .phase{
    background:#fff;border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:0 10px 10px 0;padding:16px 18px;margin:12px 0;
  }
  .phase.warn{border-left-color:var(--warn)}
  .phase.bad{border-left-color:var(--bad)}
  .phase.muted{border-left-color:var(--muted)}
  .phase-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:10px;flex-wrap:wrap}
  .phase h4{margin:0;font-size:15px;font-weight:600}
  .phase .meta{color:var(--muted);font-size:12px}

  /* ── Stat strip ───────────────────────────────────────────────────────── */
  .stat{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 18px}
  .stat .s{
    background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;min-width:110px;
  }
  .stat .s b{display:block;font-size:20px;color:var(--accent);font-weight:700;letter-spacing:-.01em}
  .stat .s span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

  /* ── Timeline entries ─────────────────────────────────────────────────── */
  .event{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
  .event:last-child{border-bottom:none}
  .event .ts{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:1px;min-width:130px}
  .event .body{flex:1;font-size:13.5px}

  /* ── Device cards ─────────────────────────────────────────────────────── */
  .device-card{
    background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;
    display:flex;flex-direction:column;gap:6px;
  }
  .device-card .serial{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .device-card .name{font-weight:600;font-size:14px}

  /* ── Copy-back prompt ─────────────────────────────────────────────────── */
  .copy-back{
    background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;margin-top:28px;
  }
  .copy-back h3{margin-top:0;color:var(--accent)}

  /* ── Drag columns (bulk-triage) ───────────────────────────────────────── */
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
  @media(max-width:700px){.kanban{grid-template-columns:1fr}}
  .col{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:200px}
  .col h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .draggable{
    background:#fff;border:1px solid var(--border);border-radius:7px;padding:10px 12px;
    margin-bottom:8px;cursor:grab;user-select:none;font-size:13px;
  }
  .draggable:active{cursor:grabbing;opacity:.8}
  .col.drag-over{border-color:var(--accent);background:#EDE8FF}

  /* ── Checkboxes ───────────────────────────────────────────────────────── */
  .check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:6px;transition:background .1s}
  .check:hover{background:var(--surface)}
  .check input{margin-top:3px;accent-color:var(--accent)}
  .check label{flex:1;cursor:pointer;font-size:13.5px}

  details{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:8px 0}
  details summary{cursor:pointer;font-weight:500}
  details summary:hover{color:var(--accent)}
  details[open]{padding-bottom:14px}
</style>
</head>
<body>

<header>
  <h1><span class="ticket">{{TICKET}}</span>{{TITLE}}</h1>
  <div class="sub">Generated <strong>{{DATE}}</strong> · {{SUBTITLE}}</div>
  <!-- Add <nav id="nav"> here when using tabs -->
</header>

<main>
  <!-- Sections go here. Use <section id="name" class="active"> for the first tab. -->
  <!-- For multi-tab: add nav buttons above and use the tab JS below. -->

  <!-- COPY-BACK BLOCK — required on every artifact -->
  <div class="copy-back">
    <h3>Continue in ARIA</h3>
    <pre id="copy-back-text">{{COPY_BACK_PROMPT}}</pre>
    <button class="btn small" onclick="
      navigator.clipboard.writeText(document.getElementById('copy-back-text').innerText)
        .then(()=>{this.textContent='Copied ✓';setTimeout(()=>this.textContent='Copy prompt',2000)})
    ">Copy prompt</button>
  </div>
</main>

<script>
/* Tab nav — activate when nav#nav exists */
(function(){
  const nav = document.getElementById('nav');
  if(!nav) return;
  const tabs = nav.querySelectorAll('button');
  const secs = document.querySelectorAll('main section');
  tabs.forEach(b => b.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    secs.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById(b.dataset.tab).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }));
})();

/* Copy-serials helper — call copyText('element-id') from any button */
function copyText(id){
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.innerText || el.value)
    .then(()=>{
      const btn = event.target;
      const orig = btn.textContent;
      btn.textContent='Copied ✓';
      setTimeout(()=>btn.textContent=orig,2000);
    });
}

/* Drag-drop for kanban columns */
(function(){
  let dragged;
  document.querySelectorAll('.draggable').forEach(el=>{
    el.draggable=true;
    el.addEventListener('dragstart',e=>{dragged=el;el.style.opacity='.5'});
    el.addEventListener('dragend',e=>{el.style.opacity='1'});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over')});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(dragged) col.appendChild(dragged);
    });
  });
})();
</script>
</body>
</html>
